name: Windows smoke test

# 在真实 Windows runner 上：静默安装 -> 校验文件 -> 启动 GUI -> 截屏
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'windows.yml 的 run id（留空 = 最近一次成功）'
        required: false
        default: ''

permissions:
  contents: read
  actions: read

jobs:
  smoke:
    runs-on: windows-latest
    steps:
      - name: Resolve packaging run
        id: find
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $rid = "${{ inputs.run_id }}".Trim()
          if (-not $rid) {
            $r = gh run list --repo "$env:GITHUB_REPOSITORY" --workflow windows.yml --status success --limit 1 --json databaseId | ConvertFrom-Json
            if (-not $r -or $r.Count -eq 0) { throw "no successful windows.yml run found" }
            $rid = $r[0].databaseId
          }
          Write-Host "using run $rid"
          "run_id=$rid" >> $env:GITHUB_OUTPUT

      - name: Download installers
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          gh run download ${{ steps.find.outputs.run_id }} --repo "$env:GITHUB_REPOSITORY" -n vigil-windows-x64 --dir dist
          if (-not (Get-ChildItem -Recurse dist -Filter '*.exe' -ErrorAction SilentlyContinue)) {
            gh run download ${{ steps.find.outputs.run_id }} --repo "$env:GITHUB_REPOSITORY" --dir dist
          }
          Get-ChildItem -Recurse dist -File | Select-Object FullName, Length | Format-Table -AutoSize

      - name: Install teacher edition silently
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Recurse dist -Filter '*teacher*.exe' | Select-Object -First 1
          if (-not $exe) { throw "teacher setup.exe not found" }
          Write-Host "installing $($exe.FullName) ($($exe.Length) bytes)"
          $p = Start-Process -FilePath $exe.FullName -ArgumentList '/S' -Wait -PassThru
          Write-Host "installer exit code: $($p.ExitCode)"
          Start-Sleep -Seconds 8
          if (-not (Test-Path 'C:\Program Files\Vigil')) { throw 'install dir missing' }
          Get-ChildItem 'C:\Program Files\Vigil' -Recurse -File |
            Select-Object @{n='rel';e={$_.FullName.Replace('C:\Program Files\Vigil\','')}}, Length |
            Sort-Object rel | Format-Table -AutoSize

      - name: Verify runtime DLLs present
        shell: pwsh
        run: |
          $root = 'C:\Program Files\Vigil'
          $must = @(
            'platforms\qwindows.dll',
            'libstdc++-6.dll',
            'libgcc_s_seh-1.dll',
            'libwinpthread-1.dll',
            'Qt6Core.dll',
            'Qt6Widgets.dll',
            'vigil-cli.exe',
            'vigil-configurator.exe',
            'vigil-master.exe'
          )
          $missing = @()
          foreach ($f in $must) {
            $p = Join-Path $root $f
            if (Test-Path $p) { Write-Host ("OK    {0,-32} {1,10}" -f $f, (Get-Item $p).Length) }
            else { Write-Host ("MISS  {0}" -f $f) -ForegroundColor Red; $missing += $f }
          }
          if ($missing.Count -gt 0) { throw "missing runtime files: $($missing -join ', ')" }

      - name: CLI smoke (proves DLLs load)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $root = 'C:\Program Files\Vigil'
          foreach ($exe in @('vigil-cli.exe', 'vigil-wcli.exe')) {
            $out = & (Join-Path $root $exe) --version 2>&1 | Out-String
            Write-Host "=== $exe --version (exit $LASTEXITCODE) ==="
            Write-Host $out
            if ($LASTEXITCODE -ne 0) { throw "$exe --version failed with $LASTEXITCODE" }
          }

      - name: Check UI language configuration
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $cli = 'C:\Program Files\Vigil\vigil-cli.exe'
          Write-Host '--- UI/Language (after install) ---'
          & $cli config get UI/Language
          Write-Host "exit=$LASTEXITCODE"
          & $cli config set UI/Language 'System (zh_CN)'
          Write-Host '--- UI/Language (after explicit set) ---'
          & $cli config get UI/Language
          Write-Host "exit=$LASTEXITCODE"

      - name: Verify anti-delete protection
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $guard = 'C:\Program Files\Vigil\netguard\VigilGuard.ps1'
          $dir   = 'C:\Program Files\Vigil'
          if (-not (Test-Path $guard)) { throw 'VigilGuard.ps1 missing' }

          Write-Host '--- install guard (teacher build has no service, file protection only) ---'
          & $guard -Install -Password 'CiTest2026' | Out-Host
          $global:LASTEXITCODE = 0

          $deny = (Get-Acl $dir).Access | Where-Object {
            $_.AccessControlType -eq 'Deny' -and
            (($_.FileSystemRights -band [Security.AccessControl.FileSystemRights]::Delete) -ne 0)
          }
          if (-not $deny) { throw 'no Deny Delete ACE on install dir' }
          Write-Host "deny ACE: $($deny.IdentityReference) $($deny.FileSystemRights)"

          $probe = Join-Path $dir 'probe-delete-me.txt'
          Set-Content -LiteralPath $probe -Value 'x' -Encoding ASCII
          $blocked = $false
          try {
            Remove-Item -LiteralPath $probe -Force -ErrorAction Stop
          } catch {
            $blocked = $true
            Write-Host "delete blocked as expected: $($_.Exception.Message)"
          }
          if (-not $blocked) { throw 'file deletion was NOT blocked' }

          Write-Host '--- wrong password must be rejected ---'
          & $guard -Release -Password 'wrong-password' | Out-Host
          if ($LASTEXITCODE -eq 0) { throw 'wrong password was accepted' }
          Write-Host "wrong password rejected, exit=$LASTEXITCODE"
          $global:LASTEXITCODE = 0
          if (-not (Test-Path $probe)) { throw 'probe disappeared even though release failed' }

          Write-Host '--- correct password releases protection ---'
          & $guard -Release -Password 'CiTest2026' | Out-Host
          $global:LASTEXITCODE = 0

          Remove-Item -LiteralPath $probe -Force -ErrorAction Stop
          if (Test-Path $probe) { throw 'probe still present after release' }
          $stillDenied = (Get-Acl $dir).Access | Where-Object {
            $_.AccessControlType -eq 'Deny' -and
            (($_.FileSystemRights -band [Security.AccessControl.FileSystemRights]::Delete) -ne 0)
          }
          if ($stillDenied) { throw 'Deny Delete ACE still present after release' }
          Write-Host 'anti-delete protection OK'

      - name: Launch GUIs and capture screenshots
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing
          New-Item -ItemType Directory -Force shots | Out-Null

          Add-Type -Namespace W -Name U -MemberDefinition '[DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr hWnd); [DllImport("user32.dll")] public static extern bool ShowWindow(IntPtr hWnd, int nCmdShow); [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr hWnd, out RECT lpRect); [DllImport("user32.dll")] public static extern bool SetWindowPos(IntPtr hWnd, IntPtr hWndInsertAfter, int X, int Y, int cx, int cy, uint uFlags); [StructLayout(LayoutKind.Sequential)] public struct RECT { public int Left; public int Top; public int Right; public int Bottom; }'

          function CaptureWindow([IntPtr]$handle, [string]$path) {
            $r = New-Object 'W.U+RECT'
            $ok = [W.U]::GetWindowRect($handle, [ref]$r)
            $w = $r.Right - $r.Left - 2
            $h = $r.Bottom - $r.Top - 2
            if (-not $ok -or $w -le 0 -or $h -le 0) {
              Write-Host "GetWindowRect failed for hwnd=$handle, falling back to full screen"
              $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
              $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
              $g = [System.Drawing.Graphics]::FromImage($bmp)
              $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
              $g.Dispose()
              $bmp.Save($path, [System.Drawing.Imaging.ImageFormat]::Png)
              $bmp.Dispose()
              return
            }

            $bmp = New-Object System.Drawing.Bitmap $w, $h
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen(($r.Left + 1), ($r.Top + 1), 0, 0, (New-Object System.Drawing.Size($w, $h)))
            $g.Dispose()
            $bmp.Save($path, [System.Drawing.Imaging.ImageFormat]::Png)
            $bmp.Dispose()
            Write-Host "saved window ${w}x${h} -> $path"
          }

          function Wait-AppWindow([System.Diagnostics.Process]$p) {
            for ($i = 0; $i -lt 60; $i++) {
              Start-Sleep -Milliseconds 500
              $p.Refresh()
              if ($p.HasExited) { return [IntPtr]::Zero }
              if ($p.MainWindowHandle -ne [IntPtr]::Zero) { return $p.MainWindowHandle }
            }
            return [IntPtr]::Zero
          }

          $masterExe = 'C:\Program Files\Vigil\vigil-master.exe'
          $cli = 'C:\Program Files\Vigil\vigil-cli.exe'

          # 1) 登录框截图（默认 Logon 认证）
          Write-Host '=== master: login dialog ==='
          $p = Start-Process -FilePath $masterExe -PassThru
          $h = Wait-AppWindow $p
          Start-Sleep -Seconds 4
          $p.Refresh()
          if ($p.MainWindowHandle -ne [IntPtr]::Zero) { $h = $p.MainWindowHandle }
          CaptureWindow $h (Join-Path $PWD 'shots\master-login.png')
          try { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue } catch {}
          Start-Sleep -Seconds 3

          # 2) 切到 KeyFile 认证：master 启动后不用输密码，主窗口能直接显示
          Write-Host '=== switch authentication to KeyFile ==='
          & $cli authkeys create ci-smoke 2>&1 | Out-Host
          & $cli config set Authentication/Method KeyFileAuthentication 2>&1 | Out-Host
          if ($LASTEXITCODE -ne 0) { Write-Host "config set exited with $LASTEXITCODE" }
          $global:LASTEXITCODE = 0
          $configPath = 'C:\ProgramData\Vigil\Config.json'
          if (Test-Path $configPath) {
            Select-String -Path $configPath -Pattern 'Method' -Context 0,1 | Out-Host
          }

          $targets = @(
            @{ name = 'configurator'; exe = 'C:\Program Files\Vigil\vigil-configurator.exe' },
            @{ name = 'master';       exe = $masterExe }
          )

          $failed = @()
          foreach ($t in $targets) {
            Write-Host "=== launching $($t.name) ==="
            $p = Start-Process -FilePath $t.exe -PassThru
            $handle = Wait-AppWindow $p
            if ($handle -eq [IntPtr]::Zero) {
              Write-Host "$($t.name) no main window" -ForegroundColor Red
              $failed += "$($t.name) no main window"
              continue
            }

            # 等待启动画面消失并让内容稳定
            Start-Sleep -Seconds 8
            $p.Refresh()
            if ($p.HasExited) {
              Write-Host "$($t.name) EXITED with code $($p.ExitCode)" -ForegroundColor Red
              $failed += "$($t.name) exited ($($p.ExitCode))"
              continue
            }
            if ($p.MainWindowHandle -ne [IntPtr]::Zero) { $handle = $p.MainWindowHandle }

            # 统一成适合 README 的窗口尺寸（CI 屏幕是 1024x768）
            [W.U]::SetWindowPos($handle, [IntPtr]::Zero, 24, 24, 960, 700, 0x0004) | Out-Null
            [W.U]::SetForegroundWindow($handle) | Out-Null
            Start-Sleep -Seconds 3

            Write-Host "$($t.name) alive, pid=$($p.Id), hwnd=$handle, title='$($p.MainWindowTitle)'"
            CaptureWindow $handle (Join-Path $PWD "shots\$($t.name).png")
            try { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue } catch {}
            Start-Sleep -Seconds 3
          }

          Get-ChildItem shots | Select-Object Name, Length | Format-Table -AutoSize
          if ($failed.Count -gt 0) { throw "GUI smoke failures: $($failed -join '; ')" }

      - name: Capture installer UI screenshot
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing
          Add-Type -Namespace W -Name U -MemberDefinition '[DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr hWnd); [DllImport("user32.dll")] public static extern bool ShowWindow(IntPtr hWnd, int nCmdShow); [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr hWnd, out RECT lpRect); [StructLayout(LayoutKind.Sequential)] public struct RECT { public int Left; public int Top; public int Right; public int Bottom; }'

          $exe = Get-ChildItem -Recurse dist -Filter '*student*.exe' | Select-Object -First 1
          if (-not $exe) { Write-Host 'no student installer, skip'; exit 0 }

          function CaptureWindow([IntPtr]$handle, [string]$path) {
            $r = New-Object 'W.U+RECT'
            [W.U]::GetWindowRect($handle, [ref]$r) | Out-Null
            $x = $r.Left + 1
            $y = $r.Top + 1
            $w = $r.Right - $r.Left - 2
            $h = $r.Bottom - $r.Top - 2
            if ($w -le 0 -or $h -le 0) { throw 'bad window rect' }
            $bmp = New-Object System.Drawing.Bitmap $w, $h
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($x, $y, 0, 0, (New-Object System.Drawing.Size($w, $h)))
            $g.Dispose()
            $bmp.Save($path, [System.Drawing.Imaging.ImageFormat]::Png)
            $bmp.Dispose()
            Write-Host "saved window ${w}x${h} -> $path"
          }

          # 当前 PowerShell 窗口最小化，避免遮挡
          $console = (Get-Process -Id $PID).MainWindowHandle
          if ($console -ne [IntPtr]::Zero) { [W.U]::ShowWindow($console, 6) | Out-Null }
          Start-Sleep -Seconds 1

          $p = Start-Process -FilePath $exe.FullName -PassThru

          # NSIS 会先解包再启动真正的向导（可能是新进程），按标题轮询
          $win = $null
          $deadline = (Get-Date).AddSeconds(120)
          while ((Get-Date) -lt $deadline) {
            Start-Sleep -Seconds 2
            foreach ($c in (Get-Process | Where-Object { $_.MainWindowHandle -ne [IntPtr]::Zero -and $_.Id -ne $PID })) {
              if ($c.MainWindowTitle -match 'Vigil') { $win = $c; break }
            }
            if ($win) { break }
          }

          if ($win) {
            Write-Host "installer window: '$($win.MainWindowTitle)' pid=$($win.Id)"
            [W.U]::SetForegroundWindow($win.MainWindowHandle) | Out-Null
            Start-Sleep -Seconds 2
            CaptureWindow $win.MainWindowHandle (Join-Path $PWD 'shots\installer.png')
          } else {
            Write-Host 'installer window did not appear in time'
          }

          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          if ($win) { Stop-Process -Id $win.Id -Force -ErrorAction SilentlyContinue }

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshots
          path: shots/
          if-no-files-found: warn
