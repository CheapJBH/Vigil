name: "Windows x64 build"

# 只构建 Windows 64 位，输出教师端 / 学生端两个安装包。
# 路线：GitHub Actions 的 windows-latest + MSYS2（MinGW-w64 原生编译），
# 不依赖上游 veyon 的 Linux 交叉编译镜像（该镜像并不存在）。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-x64:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-qt6-base
            mingw-w64-x86_64-qt6-tools
            mingw-w64-x86_64-qt6-svg
            mingw-w64-x86_64-qt6-httpserver
            mingw-w64-x86_64-qt6-websockets
            mingw-w64-x86_64-qt6-5compat
            mingw-w64-x86_64-qt6-translations
            mingw-w64-x86_64-qca-qt6
            mingw-w64-x86_64-libvncserver
            mingw-w64-x86_64-openldap
            mingw-w64-x86_64-cyrus-sasl
            mingw-w64-x86_64-lzo2
            mingw-w64-x86_64-libjpeg-turbo
            mingw-w64-x86_64-libpng
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-nsis

      - name: Sanity check toolchain
        run: |
          command -v gcc g++ cmake ninja makensis
          gcc --version | head -1
          ls /mingw64/share/qt6/plugins | head

      - name: Configure
        run: |
          mkdir -p build && cd build
          cmake .. -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH=/mingw64 \
            -DCMAKE_INSTALL_PREFIX=/mingw64 \
            -DWITH_TRANSLATIONS=OFF \
            -DQT_TRANSLATIONS_DIR=/mingw64/share/qt6/translations

      - name: Build binaries and stage
        run: |
          cd build
          ninja windows-binaries

      - name: Show staging contents
        run: |
          export MSYS2_ARG_CONV_EXCL='*'
          export MSYS_NO_PATHCONV=1
          STAGING=$(ls -d build/vigil-win* | head -1)
          WSTAGING=$(cygpath -w "$PWD/$STAGING")
          echo "STAGING=$STAGING"
          echo "WSTAGING=$WSTAGING"
          ls "$STAGING" | head -20
          echo "--- windows view ---"
          cmd //c "dir /b \"$WSTAGING\"" 2>&1 | head -30 || true
          echo "--- single file check ---"
          cmd //c "if exist \"$WSTAGING\\nsis\\welcome-page.bmp\" (echo BMP_EXISTS) else (echo BMP_MISSING)" || true

      - name: Package teacher edition
        run: |
          set -e
          export MSYS2_ARG_CONV_EXCL='*'
          export MSYS_NO_PATHCONV=1
          STAGING=$(ls -d build/vigil-win* | head -1)
          WSTAGING=$(cygpath -w "$PWD/$STAGING")
          WSRC=$(cygpath -w "$PWD")
          # 用 cmd 复制资源并打包，完全绕开 MSYS 与 Windows 的路径视图差异
          cmd //c "xcopy /E /I /Y \"$WSRC\\nsis\" \"$WSTAGING\\nsis\" >nul" || true
          cmd //c "cd /D \"$WSTAGING\" && makensis -DEDITION_TEACHER vigil.nsi"
          ls -la "$STAGING"/*setup.exe

      - name: Package student edition
        run: |
          set -e
          export MSYS2_ARG_CONV_EXCL='*'
          export MSYS_NO_PATHCONV=1
          STAGING=$(ls -d build/vigil-win* | head -1)
          WSTAGING=$(cygpath -w "$PWD/$STAGING")
          WSRC=$(cygpath -w "$PWD")
          cmd //c "xcopy /E /I /Y \"$WSRC\\nsis\" \"$WSTAGING\\nsis\" >nul" || true
          cmd //c "cd /D \"$WSTAGING\" && makensis -DEDITION_STUDENT vigil.nsi"
          ls -la "$STAGING"/*setup.exe

      - name: Collect artifacts
        run: |
          mkdir -p dist
          find build -maxdepth 3 -name "vigil-*setup.exe" -exec cp {} dist/ \;
          ls -la dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vigil-windows-x64
          path: dist/*.exe
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
