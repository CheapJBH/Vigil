name: "Windows x64 build"

# 只构建 Windows 64 位，输出教师端 / 学生端两个安装包。
# 容器镜像沿用上游 veyon 的 mingw-w64 交叉编译环境（Arch + /usr/x86_64-w64-mingw32）。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-x64:
    runs-on: ubuntu-latest
    container:
      image: veyon/ci.windows
      options: --user root
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Toolchain sanity check
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          PREFIX=/usr/x86_64-w64-mingw32
          ls -d "$PREFIX" || true
          "$PREFIX/bin/qt-cmake" --version || true
          makensis -VERSION || true
          which ninja cmake || true
          zcat /etc/*release 2>/dev/null | head -5 || true

      - name: Configure + build + stage
        run: |
          set -euo pipefail
          .ci/windows/build.sh x86_64 windows-binaries

      - name: Show staging contents
        run: |
          set -euo pipefail
          ls -d vigil-*-win* || true
          ls -la vigil-*-win*/ | head -50 || true

      - name: Package teacher edition
        run: |
          set -euo pipefail
          D=$(ls -d vigil-*-win* | head -1)
          ( cd "$D" && makensis -DEDITION_TEACHER vigil.nsi )

      - name: Package student edition
        run: |
          set -euo pipefail
          D=$(ls -d vigil-*-win* | head -1)
          ( cd "$D" && makensis -DEDITION_STUDENT vigil.nsi )

      - name: Collect artifacts
        run: |
          set -euo pipefail
          mkdir -p dist
          find . -maxdepth 2 -name "vigil-*-setup.exe" -exec cp {} dist/ \;
          ls -la dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vigil-windows-x64
          path: dist/*.exe
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
