name: "Windows x64 build"

# 只构建 Windows 64 位，输出教师端 / 学生端两个安装包。
# 使用上游同款 mingw-w64 交叉编译镜像，避免 MSYS2/MSVC 的路径与工具链差异。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-x64:
    runs-on: ubuntu-latest
    container:
      image: veyon/ci-mingw-w64:main
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Configure
        run: |
          set -euo pipefail
          PREFIX=/usr/x86_64-w64-mingw32
          mkdir -p build && cd build
          $PREFIX/bin/qt-cmake .. -G Ninja \
            -DQT_TRANSLATIONS_DIR=$PREFIX/translations

      - name: Build binaries + staging dir
        run: |
          set -euo pipefail
          cd build
          ninja windows-binaries

      - name: Show staging contents
        run: |
          set -euo pipefail
          cd build
          ls -d vigil-x86_64-* || true
          ls -la vigil-x86_64-*/ | head -40 || true

      - name: Package teacher edition
        run: |
          set -euo pipefail
          cd build
          D=$(ls -d vigil-x86_64-* | head -1)
          cd "$D"
          makensis -DEDITION_TEACHER vigil.nsi
          mv *.exe ../../ 2>/dev/null || cp *.exe ../../ || true

      - name: Package student edition
        run: |
          set -euo pipefail
          cd build
          D=$(ls -d vigil-x86_64-* | head -1)
          cd "$D"
          makensis -DEDITION_STUDENT vigil.nsi
          mv *.exe ../../ 2>/dev/null || cp *.exe ../../ || true

      - name: Collect artifacts
        run: |
          set -euo pipefail
          mkdir -p dist
          find build -maxdepth 2 -name "vigil-*-setup.exe" -exec cp {} dist/ \; || true
          ls -la dist/ || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vigil-windows-x64
          path: dist/*.exe
          if-no-files-found: warn

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
