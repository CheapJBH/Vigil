name: "Windows x64 build"

# 只构建 Windows 64 位，输出教师端 / 学生端两个安装包。
#
# 分两个 job：
#   1. build   —— MSYS2（MinGW-w64）原生编译，产出 staging 目录
#   2. package —— 纯 Windows runner 上用原生 NSIS 打包
# MSYS2 与 Windows 的路径视图混用会导致 makensis 找不到资源，因此把打包彻底隔离。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-qt6-base
            mingw-w64-x86_64-qt6-tools
            mingw-w64-x86_64-qt6-svg
            mingw-w64-x86_64-qt6-httpserver
            mingw-w64-x86_64-qt6-websockets
            mingw-w64-x86_64-qt6-5compat
            mingw-w64-x86_64-qt6-translations
            mingw-w64-x86_64-qt6-imageformats
            mingw-w64-x86_64-qca-qt6
            mingw-w64-x86_64-libvncserver
            mingw-w64-x86_64-openldap
            mingw-w64-x86_64-cyrus-sasl
            mingw-w64-x86_64-lzo2
            mingw-w64-x86_64-libjpeg-turbo
            mingw-w64-x86_64-libpng
            mingw-w64-x86_64-openssl

      - name: Sanity check toolchain
        run: |
          command -v gcc g++ cmake ninja
          gcc --version | head -1
          echo "--- QCA layout ---"
          pacman -Ql mingw-w64-x86_64-qca-qt6 2>/dev/null | grep -iE 'ossl|crypto' || echo "no qca crypto files listed"

      - name: Configure
        run: |
          mkdir -p build && cd build
          cmake .. -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH=/mingw64 \
            -DCMAKE_INSTALL_PREFIX=/mingw64 \
            -DWITH_TRANSLATIONS=OFF \
            -DQT_TRANSLATIONS_DIR=/mingw64/share/qt6/translations

      - name: Build binaries and stage
        run: |
          cd build
          ninja windows-binaries

      - name: Verify staged runtime is complete
        run: |
          set -e
          STAGING=$(ls -d build/vigil-win* | head -1)
          test -f "$STAGING/platforms/qwindows.dll"
          test -f "$STAGING/vigil.nsi"
          test -f "$STAGING/welcome-page.bmp"
          if [ ! -f "$STAGING/crypto/libqca-ossl.dll" ]; then
            echo "::warning::qca-ossl crypto plugin is missing from staging"
          fi
          ls "$STAGING/nsis"
          ls "$STAGING/platforms" "$STAGING/tls" "$STAGING/crypto"

      - name: Upload staging
        uses: actions/upload-artifact@v4
        with:
          name: vigil-staging
          path: build/vigil-win*
          if-no-files-found: error

  package:
    needs: build
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Download staging
        uses: actions/download-artifact@v4
        with:
          name: vigil-staging
          path: staging

      - name: Install NSIS
        run: choco install nsis --no-progress -y
        shell: cmd

      - name: Refresh NSIS assets from repo
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Get-ChildItem staging -Directory | Select-Object -First 1
          if (-not $dir) { throw "staging directory missing" }
          $dst = Join-Path $dir.FullName 'nsis'
          New-Item -ItemType Directory -Force $dst | Out-Null
          Copy-Item nsis\* -Destination $dst -Recurse -Force
          # 资源与 vigil.nsi 平铺，避开 makensis 的相对路径解析问题
          Copy-Item nsis\*.bmp,nsis\*.ico -Destination $dir.FullName -Force
          Get-ChildItem $dir.FullName -File | Where-Object { $_.Extension -in '.bmp','.ico' } |
            Format-Table Name, Length
          foreach ($f in @('welcome-page.bmp','header.bmp','installer.ico','uninstaller.ico')) {
            if (-not (Test-Path (Join-Path $dir.FullName $f))) { throw "NSIS asset missing: $f" }
          }
          Write-Host "staging root: $($dir.FullName)"

      - name: List staging
        shell: pwsh
        run: |
          Get-ChildItem -Recurse staging | Select-Object FullName, Length | Format-Table -AutoSize

      - name: Package both editions
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $makensis = 'C:\Program Files (x86)\NSIS\makensis.exe'
          if (-not (Test-Path $makensis)) { throw "makensis not found at $makensis" }

          $dir = Get-ChildItem staging -Directory | Select-Object -First 1
          if (-not $dir) { throw "staging directory missing" }
          $root = $dir.FullName.Replace('\', '/')
          Write-Host "packaging in $root"
          Push-Location $dir.FullName
          try {
            & $makensis "-DNSIS_DIR=$root" -DEDITION_TEACHER vigil.nsi
            if ($LASTEXITCODE -ne 0) { throw "teacher packaging failed ($LASTEXITCODE)" }
            & $makensis "-DNSIS_DIR=$root" -DEDITION_STUDENT vigil.nsi
            if ($LASTEXITCODE -ne 0) { throw "student packaging failed ($LASTEXITCODE)" }
          } finally {
            Pop-Location
          }

          New-Item -ItemType Directory -Force dist | Out-Null
          Get-ChildItem staging -Recurse -Filter "*setup.exe" | ForEach-Object {
            Copy-Item $_.FullName dist\
            Write-Host "collected $($_.Name) ($($_.Length) bytes)"
          }
          Get-ChildItem dist

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: vigil-windows-x64
          path: dist/*.exe
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
