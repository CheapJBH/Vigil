name: Classroom pairing E2E

# 端到端验证「免口令自动配对」：
#   安装教师端 -> 创建课堂密钥 -> 启动 PairServer(-AutoAccept)
#   -> 跑学生端 -Silent 配对 -> 断言公钥/认证方式/日志/计划任务
#   -> 截学生端引导界面
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download teacher installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://github.com/CheapJBH/Vigil/releases/download/v4.11.4/vigil-teacher-4.11.4.0-win64-setup.exe'
          Invoke-WebRequest -Uri $url -OutFile teacher.exe -UseBasicParsing
          Write-Host "downloaded: $((Get-Item teacher.exe).Length) bytes"

      - name: Install teacher silently
        shell: pwsh
        run: |
          $p = Start-Process -FilePath .\teacher.exe -ArgumentList '/S' -Wait -PassThru
          Write-Host "installer exit: $($p.ExitCode)"
          Start-Sleep -Seconds 8
          Write-Host "--- install dir ---"
          Get-ChildItem 'C:\Program Files\Vigil' -ErrorAction SilentlyContinue |
            Select-Object Name, Length | Format-Table -AutoSize | Out-String | Write-Host
          Write-Host "--- services matching vigil ---"
          Get-Service | Where-Object { $_.Name -like '*igil*' } | Format-Table Name, Status | Out-String | Write-Host
          Write-Host "--- sc query VigilService ---"
          sc.exe query VigilService 2>&1 | Out-String | Write-Host

          $wcli = 'C:\Program Files\Vigil\vigil-wcli.exe'
          if (-not (Test-Path $wcli)) { throw "vigil-wcli.exe missing" }
          Write-Host "--- wcli --version ---"
          & $wcli --version 2>&1 | Out-String | Write-Host
          Write-Host "--- wcli service register (manual) ---"
          & $wcli service register 2>&1 | Out-String | Write-Host
          Write-Host "register exit: $LASTEXITCODE"
          Start-Sleep -Seconds 3
          sc.exe query VigilService 2>&1 | Out-String | Write-Host

          $svc = Get-Service -Name VigilService -ErrorAction SilentlyContinue
          if (-not $svc) { throw "VigilService still missing after manual register" }
          $svc | Format-List Name, Status, StartType

      - name: Create classroom key
        shell: pwsh
        run: |
          $cli = 'C:\Program Files\Vigil\vigil-cli.exe'
          & $cli authkeys create classroom
          & $cli authkeys list

      - name: Start pair server with AutoAccept
        shell: pwsh
        run: |
          $ps1 = Join-Path $PWD 'tools\classroom-setup\teacher\VigilPairServer.ps1'
          $log = Join-Path $PWD 'pair.log'
          if (Test-Path $log) { Remove-Item $log -Force }
          Write-Host "server script: $ps1 (exists=$(Test-Path $ps1))"
          $proc = Start-Process powershell -ArgumentList @(
            '-NoProfile','-ExecutionPolicy','Bypass','-File',$ps1,
            '-Code','1234','-AutoAccept','-LogFile',$log
          ) -WindowStyle Hidden -PassThru
          Start-Sleep -Seconds 5
          Write-Host "pair server pid=$($proc.Id) exited=$($proc.HasExited)"
          Write-Host "--- pair.log ---"
          if (Test-Path $log) { Get-Content $log } else { Write-Host "(pair.log not created)" }
          Write-Host "--- listening ports ---"
          Get-NetTCPConnection -LocalPort 11101 -ErrorAction SilentlyContinue |
            Format-Table LocalAddress, LocalPort, State, OwningProcess | Out-String | Write-Host
          "--- /ping ---"
          (Invoke-WebRequest 'http://127.0.0.1:11101/ping' -UseBasicParsing).Content
          "--- /pair?auto=1 (should return PEM) ---"
          $pem = (Invoke-WebRequest 'http://127.0.0.1:11101/pair?auto=1&name=e2e-runner' -UseBasicParsing).Content
          if ($pem -notmatch 'BEGIN PUBLIC KEY') { throw "/pair?auto=1 did not return a public key" }
          Write-Host "got PEM: $($pem.Length) chars"

      - name: Diagnose key import path
        shell: pwsh
        run: |
          $cli = 'C:\Program Files\Vigil\vigil-cli.exe'
          Write-Host "--- authkeys list (before) ---"
          & $cli authkeys list 2>&1 | Out-String | Write-Host
          Write-Host "--- delete classroom/public ---"
          & $cli authkeys delete classroom/public 2>&1 | Out-String | Write-Host
          Write-Host "delete exit=$LASTEXITCODE"
          Write-Host "--- list after delete ---"
          & $cli authkeys list 2>&1 | Out-String | Write-Host
          Write-Host "--- where are keys stored ---"
          Get-ChildItem 'C:\ProgramData\Vigil' -Recurse -Filter '*.pem' -ErrorAction SilentlyContinue |
            Select-Object FullName, Length | Format-Table -AutoSize | Out-String | Write-Host
          Get-ChildItem "$env:ProgramData\Vigil" -Directory -ErrorAction SilentlyContinue |
            Select-Object FullName | Out-String | Write-Host
          Write-Host "--- try import via temp pem ---"
          $pem = (Invoke-WebRequest 'http://127.0.0.1:11101/pair?auto=1&name=diag' -UseBasicParsing).Content
          $tmp = Join-Path $env:TEMP 'diag-pub.pem'
          Set-Content -Path $tmp -Value $pem -Encoding ASCII -NoNewline
          & $cli authkeys import 'classroom/public' $tmp 2>&1 | Out-String | Write-Host
          Write-Host "import exit=$LASTEXITCODE"
          & $cli authkeys list 2>&1 | Out-String | Write-Host

      - name: Run student silent pairing
        shell: pwsh
        run: |
          $ps1 = Join-Path $PWD 'tools\classroom-setup\student\VigilStudentSetup.ps1'
          $out = & powershell -NoProfile -ExecutionPolicy Bypass -File $ps1 -Silent -TeacherIp 127.0.0.1 -Retry 2 2>&1
          $code = $LASTEXITCODE
          $out | Out-String | Write-Host
          Write-Host "student exit code: $code"
          $log = Join-Path $env:ProgramData 'Vigil\auto-pair.log'
          if (Test-Path $log) { "--- auto-pair.log ---"; Get-Content $log }

      - name: Assert pairing results
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cli = 'C:\Program Files\Vigil\vigil-cli.exe'
          $fail = 0

          $keys = & $cli authkeys list 2>&1 | Out-String
          Write-Host "--- authkeys ---"; $keys
          if ($keys -notmatch 'classroom') { Write-Host "::error::classroom key not found"; $fail++ }

          $method = (& $cli config get Authentication/Method 2>&1 | Out-String).Trim()
          Write-Host "--- Authentication/Method = $method"
          if ($method -notmatch 'KeyFile') { Write-Host "::error::auth method not KeyFile"; $fail++ }

          $log = Join-Path $env:ProgramData 'Vigil\auto-pair.log'
          if (Test-Path $log) {
            $text = Get-Content $log -Raw
            if ($text -notmatch '配对成功') { Write-Host "::error::auto-pair.log has no success entry"; $fail++ }
          } else {
            Write-Host "::error::auto-pair.log missing"; $fail++
          }

          $svc = Get-Service VigilService
          Write-Host "--- service: $($svc.Status)"
          if ($svc.Status -ne 'Running') { Write-Host "::error::service not running"; $fail++ }

          if ($fail -gt 0) { throw "$fail assertion(s) failed" }
          Write-Host "ALL ASSERTIONS PASSED"

      - name: Install autostart task and verify
        shell: pwsh
        run: |
          $ps1 = Join-Path $PWD 'tools\classroom-setup\student\VigilStudentSetup.ps1'
          & powershell -NoProfile -ExecutionPolicy Bypass -File $ps1 -Silent -InstallAutoStart
          Start-Sleep -Seconds 2
          $t = Get-ScheduledTask -TaskName 'VigilAutoPair' -ErrorAction SilentlyContinue
          if (-not $t) { throw "VigilAutoPair task not registered" }
          $t | Format-List TaskName, State
          (Get-ScheduledTaskInfo -TaskName 'VigilAutoPair') | Format-List

      - name: Screenshot student guidance UI
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $ps1 = Join-Path $PWD 'tools\classroom-setup\student\VigilStudentSetup.ps1'
          $p = Start-Process powershell -ArgumentList @('-NoProfile','-ExecutionPolicy','Bypass','-File',$ps1) -PassThru
          Start-Sleep -Seconds 6
          $p.Refresh()
          Write-Host "window title: $($p.MainWindowTitle)"
          # 整屏截图（避免 P/Invoke，runner 分辨率固定 1024x768）
          $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
          $g.Dispose()
          New-Item -ItemType Directory -Force out | Out-Null
          $bmp.Save((Join-Path $PWD 'out\student-join.png'), [System.Drawing.Imaging.ImageFormat]::Png)
          $bmp.Dispose()
          Write-Host "screenshot saved: out\student-join.png"
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: classroom-e2e
          path: |
            out/
            pair.log
            /ProgramData/Vigil/auto-pair.log
          if-no-files-found: warn
